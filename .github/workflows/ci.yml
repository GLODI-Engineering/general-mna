name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Cargo.toml resolves general-spice-core, continuous-blocks and pwl-devices as *path*
# dependencies into the sibling checkouts `../spice-lsp` and `../general-simulator` (see the
# comment there for why `path` + `version` are both kept). A runner only has this repository,
# so every job reproduces the local three-directory layout under $GITHUB_WORKSPACE:
#
#   $GITHUB_WORKSPACE/general-mna               <- this repository (working directory of every step)
#   $GITHUB_WORKSPACE/general-simulator         <- GLODI-Engineering/general-simulator, default branch
#   $GITHUB_WORKSPACE/spice-lsp                 <- GLODI-Engineering/spice-lsp, default branch
#   $GITHUB_WORKSPACE/gs-waveform-measurements  <- GLODI-Engineering/gs-waveform-measurements, default branch
#
# so that `../general-simulator/crates/continuous-blocks` etc. resolve exactly as they do on a
# developer machine. The fourth checkout is not a dependency of this crate at all: cargo loads
# every member manifest of the sibling *workspace* a path dependency belongs to, and
# general-simulator's CLI member points at `../../../gs-waveform-measurements`, so without it
# `cargo metadata` (which `cargo fmt --all` runs first) fails before anything is built. All
# three sibling repositories are public, so the default GITHUB_TOKEN can read them; no extra
# secret is needed.

jobs:
  rust:
    name: Rust (fmt, clippy, test -- default features)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: general-mna
    steps:
      - name: Check out general-mna
        uses: actions/checkout@v4
        with:
          path: general-mna

      - name: Check out sibling general-simulator (continuous-blocks, pwl-devices)
        uses: actions/checkout@v4
        with:
          repository: GLODI-Engineering/general-simulator
          path: general-simulator

      - name: Check out sibling spice-lsp (general-spice-core)
        uses: actions/checkout@v4
        with:
          repository: GLODI-Engineering/spice-lsp
          path: spice-lsp

      - name: Check out sibling gs-waveform-measurements (general-simulator workspace member dependency)
        uses: actions/checkout@v4
        with:
          repository: GLODI-Engineering/gs-waveform-measurements
          path: gs-waveform-measurements

      # A change that moves a version across a repository boundary cannot be green in
      # either repository until it is green in both: this branch asks for a sibling
      # version that exists only on the sibling's own branch -- this crate takes
      # continuous-blocks and pwl-devices from general-simulator's workspace, so a
      # version bump there has to be visible here. So when a sibling carries a branch of
      # this one's name, test against that branch rather than its default branch;
      # otherwise the two repositories deadlock and neither side can go first.
      - name: Prefer sibling branches of the same name, when they exist
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          ref="${{ github.head_ref || github.ref_name }}"
          for d in general-simulator spice-lsp gs-waveform-measurements; do
            if git -C "$d" ls-remote --exit-code --heads origin "$ref" >/dev/null 2>&1; then
              git -C "$d" fetch -q --depth 1 origin "$ref"
              git -C "$d" checkout -q FETCH_HEAD
              echo "$d: testing against branch $ref"
            else
              echo "$d: no branch $ref, using its default branch"
            fi
          done

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: general-mna

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (default features -- no Python build dependency)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test (default features)
        run: cargo test --workspace --release

      # Not -D warnings: this crate currently has ~13 broken rustdoc intra-doc links (mostly
      # doc-comment references to symbols that actually live in the general-simulator/spice-lsp
      # repos, or to private items) -- a real cleanup, but out of scope for wiring up CI itself.
      # cargo doc still fails this step outright on a genuine doc-build error, just not on warnings.
      - name: cargo doc
        run: cargo doc --workspace --no-deps

  rust-python:
    name: Rust (build, clippy -- optional python feature)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: general-mna
    steps:
      - name: Check out general-mna
        uses: actions/checkout@v4
        with:
          path: general-mna

      - name: Check out sibling general-simulator (continuous-blocks, pwl-devices)
        uses: actions/checkout@v4
        with:
          repository: GLODI-Engineering/general-simulator
          path: general-simulator

      - name: Check out sibling spice-lsp (general-spice-core)
        uses: actions/checkout@v4
        with:
          repository: GLODI-Engineering/spice-lsp
          path: spice-lsp

      - name: Check out sibling gs-waveform-measurements (general-simulator workspace member dependency)
        uses: actions/checkout@v4
        with:
          repository: GLODI-Engineering/gs-waveform-measurements
          path: gs-waveform-measurements

      # A change that moves a version across a repository boundary cannot be green in
      # either repository until it is green in both: this branch asks for a sibling
      # version that exists only on the sibling's own branch -- this crate takes
      # continuous-blocks and pwl-devices from general-simulator's workspace, so a
      # version bump there has to be visible here. So when a sibling carries a branch of
      # this one's name, test against that branch rather than its default branch;
      # otherwise the two repositories deadlock and neither side can go first.
      - name: Prefer sibling branches of the same name, when they exist
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          ref="${{ github.head_ref || github.ref_name }}"
          for d in general-simulator spice-lsp gs-waveform-measurements; do
            if git -C "$d" ls-remote --exit-code --heads origin "$ref" >/dev/null 2>&1; then
              git -C "$d" fetch -q --depth 1 origin "$ref"
              git -C "$d" checkout -q FETCH_HEAD
              echo "$d: testing against branch $ref"
            else
              echo "$d: no branch $ref, using its default branch"
            fi
          done

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: general-mna

      # Pinned, not "3.x". That floats forward with the runner image and has
      # now outrun the pinned PyO3: this job began failing with "the
      # configured Python version (3.15) is newer than PyO3's maximum
      # supported version (3.14)" on a commit that touched only a Markdown
      # file. Raise this deliberately when PyO3 is upgraded.
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: cargo clippy (python feature)
        run: cargo clippy --workspace --all-targets --features python -- -D warnings

      - name: cargo test (python feature)
        run: cargo test --workspace --release --features python
