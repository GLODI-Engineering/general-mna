[package]
name = "general-mna"
version = "0.1.0"
edition = "2021"
description = "Educational modified nodal analysis and converter averaging built on general-spice-core"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Elvis-codeur/general-mna"
homepage = "https://github.com/Elvis-codeur/general-mna"
documentation = "https://docs.rs/general-mna"
readme = "README.md"
keywords = ["spice", "circuit-simulation", "mna", "electronics"]
categories = ["science", "simulation"]
publish = true

[lib]
name = "general_mna"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.27", features = ["extension-module"], optional = true }
# Cross-repo: general-spice-core/continuous-blocks/pwl-devices each live in a separate git
# repo (spice-lsp, general-simulator). `path` keeps local builds working against the sibling
# checkouts already required today; `version` is what actually resolves once those crates are
# published, and is required for `cargo publish` of general-mna itself to succeed at all
# (crates.io ignores `path`, needs `version`).
general-spice-core = { path = "../spice-lsp/servers/core", version = "0.1.0" }
continuous-blocks = { path = "../general-simulator/crates/continuous-blocks", version = "0.1.0" }
pwl-devices = { path = "../general-simulator/crates/pwl-devices", version = "0.1.0" }
